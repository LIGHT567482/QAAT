# ── keepalive ────────────────────────────────────────────────────────────────
# Keep ALL FIVE Render free-tier web instances from ever sleeping — gateway, auth,
# session, sync and notify — so no request path (login, warden validation, sync
# upload, no-show/office-round notifications) cold-starts behind its proxy into a
# ~30s-timeout 502.
#
# scripts/keepalive.sh pings each /health every run and RETRIES a 502/503 until the
# instance confirms 200, so a late-scheduled run still catches whatever fell asleep
# and warms it instead of merely poking once. A run ends red (GitHub mails the owner)
# when an instance cannot be confirmed warm or answers something unexpected.
#
# Render's free web instances sleep after ~15 minutes of idle. GitHub schedules this
# every 5 minutes; even with scheduling jitter, the retry-until-warm logic absorbs it.
# For extra belt-and-braces run scripts/keepalive.sh --loop 300 on any always-on box.

name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # manual trigger for testing

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Warm + confirm all five instances
        run: bash scripts/keepalive.sh

      - name: Log endpoint list (for visibility in the Actions run)
        run: bash scripts/keepalive.sh --list
