# Drop-in for U-Panel nginx (conf.d). Cloudflare Flexible still hits origin :80;
# this server_name is more specific than U-Panel's `_` catch-all (which 302s `/`
# to `/download/` — the APK landing page).
#
# proxy_pass target is filled by scripts/contabo/attach-upanel-nginx.sh
# (U-Panel bridge gateway + host 9080). Do not join qaat_internal from this
# container: `redis` exists on both networks.

server {
    listen 80;
    listen [::]:80;
    server_name qaat.orion13.us students.orion13.us;

    client_max_body_size 32m;

    location / {
        proxy_pass http://__QAAT_ORIGIN__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
