# TEMPLATE — fill values before applying.
# Use `kubectl create secret generic` or Sealed Secrets / ESO in production.
# Never commit real secret values.
apiVersion: v1
kind: Secret
metadata:
  name: qaat-secrets
  namespace: qaat
type: Opaque
stringData:
  db-password:          "REPLACE_ME"
  redis-password:       "REPLACE_ME"
  key-encryption-key:   "REPLACE_ME_32_BYTE_HEX"
  # Two DSNs (update.md C1):
  #   app-db-url : NON-superuser qaat_app role — the tenant data plane (gateway
  #                data plane, qr-generator, session-manager). RLS is ENFORCED.
  #   db-url     : privileged owner role — auth-service, sync-receiver, and the
  #                gateway's ADMIN_DB_URL (cross-tenant ADMIN handlers) only.
  # Use sslmode=require (or verify-full) in production.
  app-db-url:           "postgres://qaat_app:REPLACE_ME@postgres:5432/qaat?sslmode=require"
  db-url:               "postgres://qaat:REPLACE_ME@postgres:5432/qaat?sslmode=require"
  redis-url:            "redis://:REPLACE_ME@redis:6379/0"
  # RSA keys — base64-encoded PEM files
  # kubectl create secret generic qaat-rsa \
  #   --from-file=auth_private.pem=keys/auth_private.pem \
  #   --from-file=auth_public.pem=keys/auth_public.pem \
  #   -n qaat
