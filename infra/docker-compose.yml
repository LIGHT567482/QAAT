version: '3.9'

services:

  # ─── Data layer ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qaat}
      POSTGRES_USER: ${DB_USER:-qaat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
      - ../db/seeds:/seeds:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qaat} -d ${DB_NAME:-qaat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis} --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Backend services ─────────────────────────────────────────────────────

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: postgres://${DB_USER:-qaat}:${DB_PASSWORD:-changeme_db}@postgres:5432/${DB_NAME:-qaat}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      RSA_PRIVATE_KEY_PATH: /run/secrets/auth_private.pem
      RSA_PUBLIC_KEY_PATH: /run/secrets/auth_public.pem
      JWT_ISSUER: ${AUTH_JWT_ISSUER:-qaat-auth}
      JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-qaat-api}
      JWT_TTL_SECONDS: ${AUTH_JWT_TTL_SECONDS:-86400}
      # Required since update.md H2/§3: master key for encrypting the coordinator
      # device-binding key at rest. Without it, coordinator login fails.
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ../keys/auth_private.pem:/run/secrets/auth_private.pem:ro
      - ../keys/auth_public.pem:/run/secrets/auth_public.pem:ro
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-8443}
      AUTH_SERVICE_URL: http://auth-service:8081
      RSA_PUBLIC_KEY_PATH: /run/secrets/auth_public.pem
      JWT_ISSUER: ${AUTH_JWT_ISSUER:-qaat-auth}
      JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-qaat-api}
      # Tenant data plane connects as the NON-superuser qaat_app role so RLS is
      # enforced (update.md C1 / migration 009). ADMIN_DB_URL is the privileged
      # connection used ONLY by the ADMIN-gated, cross-tenant platform handlers.
      DB_URL: postgres://${APP_DB_USER:-qaat_app}:${APP_DB_PASSWORD:-changeme_app}@postgres:5432/${DB_NAME:-qaat}?sslmode=disable
      ADMIN_DB_URL: postgres://${DB_USER:-qaat}:${DB_PASSWORD:-changeme_db}@postgres:5432/${DB_NAME:-qaat}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ../keys/auth_public.pem:/run/secrets/auth_public.pem:ro
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  qr-generator:
    build:
      context: ../services/qr-generator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3002"
      # Connects as qaat_app (RLS-enforced); every query is run under a
      # tenant-scoped GUC by db.withTenant().
      DB_URL: postgres://${APP_DB_USER:-qaat_app}:${APP_DB_PASSWORD:-changeme_app}@postgres:5432/${DB_NAME:-qaat}?sslmode=disable
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # qr-generator verifies the RS256 JWT itself (update.md H1).
      RSA_PUBLIC_KEY_PATH: /run/secrets/auth_public.pem
      JWT_ISSUER: ${AUTH_JWT_ISSUER:-qaat-auth}
      JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-qaat-api}
      # Required — must be a real 32-byte hex key; no all-zeros fallback.
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ../keys/auth_public.pem:/run/secrets/auth_public.pem:ro
    ports:
      - "3012:3002"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3004"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-qaat.platform}
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "3004:3004"
    depends_on:
      - mailhog

  student-portal:
    build:
      context: ../apps/student-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"

  # ─── Dev tooling ─────────────────────────────────────────────────────────

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  pgdata:
  redisdata:
