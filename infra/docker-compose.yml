# QAAT — development stack.
# One Go (Gin) backend + Next.js web dashboard + PostgreSQL.
# Flutter (frontend/mobile) runs on the host via `make dev-mobile`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qaat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qaat}
      POSTGRES_DB: ${POSTGRES_DB:-qaat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qaat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qaat} -d ${POSTGRES_DB:-qaat}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      QAAT_ADDR: ":8080"
      QAAT_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-qaat}@postgres:5432/${POSTGRES_DB:-qaat}?sslmode=disable
      QAAT_JWT_SECRET: ${QAAT_JWT_SECRET:-dev-insecure-secret-change-me}
      QAAT_PUBLIC_API_URL: ${QAAT_PUBLIC_API_URL:-http://localhost:8080}
      QAAT_ENV: ${QAAT_ENV:-dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  qaat-pgdata:
