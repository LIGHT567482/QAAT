<!DOCTYPE html>
<!-- Lecturer gate page served by the embedded hub over the hotspot. NO QR: presence proof is
     simply being on the coordinator's hotspot LAN (this server is only reachable there). The page
     pulls the live rotating room code itself from GET /status — the lecturer never scans or types
     it. They enter only their staff ID. First confirm = START, second = END. We POST
     {staff_id, room_code, fingerprint, biometric_verified} to /gate. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QAAT — Lecturer gate</title>
<style>body{font-family:system-ui;max-width:380px;margin:auto;padding:24px;text-align:center}
input{font-size:22px;text-align:center;width:100%;padding:14px;border:2px solid #cbd5e1;border-radius:12px;box-sizing:border-box}
button{margin-top:16px;width:100%;padding:14px;font-size:16px;font-weight:700;color:#fff;background:#7c3aed;border:0;border-radius:12px}
button:disabled{opacity:.5}#done{display:none}.big{background:#f5f3ff;border:2px solid #7c3aed;border-radius:14px;padding:16px;margin-top:16px}
.t{font-size:18px;font-weight:800;color:#5b21b6}.muted{color:#64748b;font-size:13px}</style></head>
<body>
<div id="form">
  <h2 id="title">Lecturer gate</h2>
  <p class="muted" id="rcnote">You're on the class Wi-Fi. Enter your staff ID to start/end the session.</p>
  <input id="staff" inputmode="text" placeholder="Your staff ID (e.g. KIU/STAFF/001)" autofocus>
  <button id="go" onclick="submit()">Confirm</button>
  <p id="err" style="color:#b91c1c"></p>
</div>
<div id="done">
  <div style="font-size:56px">🎓</div><h2 id="doneTitle">Recorded</h2>
  <div class="big"><div class="t" id="doneMsg"></div></div>
</div>
<script>
// Label START vs END from the live session; being on the hotspot is the presence proof (no QR).
(async function(){ try{
  var s=await (await fetch('/session')).json();
  var started = s && s.lecturer_started==='true';
  var unit = (s && s.unit_name) ? (' — '+s.unit_name) : '';
  document.getElementById('title').textContent = started ? ('End session'+unit) : ('Start session'+unit);
  document.getElementById('go').textContent = started ? 'End session' : 'Start session';
}catch(e){} })();
async function fingerprint(){var raw=[navigator.userAgent,navigator.language,screen.width+'x'+screen.height,new Date().getTimezoneOffset()].join('|');
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function submit(){
  var staff=document.getElementById('staff').value.trim();
  var err=document.getElementById('err'), go=document.getElementById('go');
  if(!staff){err.textContent='Enter your staff ID.';return;}
  go.disabled=true; err.textContent='';
  try{
    // Pull the current rotating code straight from the hub — the lecturer never sees or types it.
    var st=await (await fetch('/status')).json();
    var rc=(st&&st.room_code)||'';
    if(!rc){ err.textContent='No live session on this hotspot yet — ask the coordinator to open the session, then retry.'; go.disabled=false; return; }
    var fp=await fingerprint();
    var body=new URLSearchParams({staff_id:staff,room_code:rc,fingerprint:fp,biometric_verified:'false'});
    var d=await (await fetch('/gate',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})).json();
    if(d.status==='STARTED'||d.status==='ENDED'){
      document.getElementById('form').style.display='none';
      var done=document.getElementById('done');done.style.display='block';
      document.getElementById('doneTitle').textContent = d.status==='STARTED' ? 'Session started' : 'Session ended';
      document.getElementById('doneMsg').textContent = d.status==='STARTED'
        ? 'Students can now check in.' : 'Attendance is sealed for this session.';
    } else {
      var reason=(d.reason||'try again').replace(/_/g,' ').toLowerCase();
      err.textContent='Rejected: '+reason+'. Please retry.'; go.disabled=false;
    }
  }catch(e){ err.textContent='Couldn’t reach the class server — make sure Mobile Data is OFF and you are on the class Wi-Fi, then retry.'; go.disabled=false; }
}
</script></body></html>
